<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery form</title>
    <!-- Icons (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="form style.css">
</head>
<body>
<div class="container">
    <form action="https://formspree.io/f/xaqaglgr" method="POST" class="form">
        <h2>ENTER YOUR DETAILS FOR DELIVERY</h2>
        <p>Please make sure you provide clear and specific location for easy and fast delivery of your goods.</p>
        <h4></h4>
        <!-- Full Name -->
        <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="text" name="fullname" required>
            <label>Full Name</label>
        </div>
        <!-- Address -->
        <div class="input-group">
            <i class="fa fa-home"></i>
            <textarea name="address" required></textarea>
            <label>Full Address</label>
        </div>
        
        <!-- Phone -->
        <div class="input-group">
            <i class="fa fa-phone"></i>
            <input type="tel" name="phone" pattern="[0-9]{10,15}" required>
            <label>Phone Number</label>
        </div>
        <div class="input-group">
            
            <input type="text" name="full item details" required>
            <label>Specify item</label>
        </div>

        <div class="input-group">
            
            <input type="number" name="number" required>
            <label>Amount of items you want</label>
        </div>

        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
